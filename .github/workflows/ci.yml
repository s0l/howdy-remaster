name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Python runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-gi \
            python3-numpy \
            python3-opencv

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            howdy/src/cli.py \
            howdy/src/compare.py \
            howdy/src/i18n.py \
            howdy/src/paths_factory.py \
            howdy/src/snapshot.py \
            howdy/src/cli/*.py \
            howdy/src/face_backends/*.py \
            howdy/src/recorders/*.py \
            howdy/src/rubberstamps/*.py \
            howdy-gtk/src/*.py

      - name: Check OpenCV SFace APIs
        run: |
          python3 - <<'PY'
          import cv2

          missing = [
              name
              for name in ["FaceDetectorYN", "FaceRecognizerSF"]
              if not hasattr(cv2, name)
          ]
          if missing:
              raise SystemExit("OpenCV is missing required APIs: " + ", ".join(missing))
          PY

  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libpam0g-dev \
            libevdev-dev \
            libinih-dev \
            libopencv-dev \
            libopencv-contrib-dev \
            python3 \
            python3-gi \
            python3-numpy \
            python3-opencv \
            gir1.2-gtk-3.0

      - name: Configure Meson
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=release \
            -Dconfig_dir=/etc/howdy \
            -Ddlib_data_dir=/etc/howdy/dlib-data \
            -Dface_data_dir=/etc/howdy/face-models \
            -Duser_models_dir=/etc/howdy/models \
            -Dpy_sources_dir=/lib/security \
            -Dpam_dir=/lib/security \
            -Dinstall_pam_config=true

      - name: Build PAM module and generated files
        run: meson compile -C build

  package:
    name: package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            dpkg-dev \
            libpam0g-dev \
            libevdev-dev \
            libinih-dev \
            libopencv-dev \
            libopencv-contrib-dev \
            python3 \
            python3-gi \
            python3-numpy \
            python3-opencv \
            gir1.2-gtk-3.0 \
            curl

      - name: Build Debian package
        run: |
          VERSION="3.0.0+ci" ./scripts/build-deb.sh

      - name: Inspect package contents
        run: |
          set -euo pipefail
          DEB_PATH="dist/howdy-opencv-sface_3.0.0+ci_amd64.deb"

          dpkg-deb -I "$DEB_PATH"
          dpkg-deb -c "$DEB_PATH" | tee package-contents.txt

          grep -F "./lib/security/pam_howdy.so" package-contents.txt
          grep -F "./lib/security/howdy/compare.py" package-contents.txt
          grep -F "./lib/security/howdy/face_backends/opencv_sface.py" package-contents.txt
          grep -F "./etc/howdy/face-models/face_detection_yunet_2023mar.onnx" package-contents.txt
          grep -F "./etc/howdy/face-models/face_recognition_sface_2021dec.onnx" package-contents.txt
          grep -F "./var/cache/howdy/" package-contents.txt

      - name: Simulate package installation
        run: sudo apt-get install --simulate ./dist/howdy-opencv-sface_3.0.0+ci_amd64.deb

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Reject generated artifacts
        run: |
          set -euo pipefail
          bad_files="$(find . \
            -path './.git' -prune -o \
            \( -name '*.pyc' -o -name '__pycache__' -o -path './build/*' -o -path './dist/*' \) \
            -print)"
          if [ -n "$bad_files" ]; then
            echo "$bad_files"
            exit 1
          fi

      - name: Reject dlib runtime imports
        run: |
          if find howdy/src -type f ! -path '*/dlib-data/*' -print0 \
            | xargs -0 grep --line-number -E '(^|[[:space:]])(import dlib|from dlib)'; then
            echo "Runtime dlib imports are not allowed in the OpenCV backend build."
            exit 1
          fi
